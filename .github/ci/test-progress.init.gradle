// CI-only: record when each test class and method starts and ends, and on which
// Gradle test executor. When a worker JVM dies without a failing test, the last
// records of that executor point at the suspects. Gradle may still emit end
// events for a crashed worker's suites, so the records are evidence to read with
// the worker's exit status, not a verdict. Enabled by ci-run.sh via CI_DIAG_DIR.
//
// Record format: <HH:mm:ss.SSS> <EVENT> <executor> <name> [<result> <ms>]
// Diagnostics must never change the build result: any I/O failure disables
// recording for the task after one warning.

def diagDir = System.getenv('CI_DIAG_DIR')
if (diagDir) {
  allprojects {
    tasks.withType(Test).configureEach { Test task ->
      def name = "${task.project.path}:${task.name}".replaceAll('[^A-Za-z0-9_.-]', '_')
      def out = new File(diagDir, "test-progress-${name}.log")
      def lock = new Object()
      def enabled = true
      def executorOf = { TestDescriptor d ->
        while (d != null && !(d.name ?: '').startsWith('Gradle Test Executor')) {
          d = d.parent
        }
        d?.name?.replace(' ', '_') ?: '-'
      }
      def write = { String line ->
        synchronized (lock) {
          if (!enabled) {
            return
          }
          try {
            def time = new Date().format('HH:mm:ss.SSS', TimeZone.getTimeZone('UTC'))
            out << "${time} ${line}\n"
          } catch (Throwable e) {
            enabled = false
            task.logger.warn("CI test-progress recording disabled for ${task.path}: ${e}")
          }
        }
      }
      task.doFirst {
        try {
          out.text = ''
        } catch (Throwable e) {
          enabled = false
          task.logger.warn("CI test-progress recording disabled for ${task.path}: ${e}")
        }
      }
      task.addTestListener(new TestListener() {
        void beforeSuite(TestDescriptor suite) {
          if (suite.className) {
            write("SUITE_START ${executorOf(suite)} ${suite.className}")
          }
        }

        void afterSuite(TestDescriptor suite, TestResult result) {
          if (suite.className) {
            write("SUITE_END ${executorOf(suite)} ${suite.className} " +
                "${result.resultType} ${result.endTime - result.startTime}")
          }
        }

        void beforeTest(TestDescriptor test) {
          write("TEST_START ${executorOf(test)} ${test.className}.${test.name}")
        }

        void afterTest(TestDescriptor test, TestResult result) {
          write("TEST_END ${executorOf(test)} ${test.className}.${test.name} " +
              "${result.resultType} ${result.endTime - result.startTime}")
        }
      })
    }
  }
}
