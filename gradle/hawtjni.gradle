import java.security.MessageDigest
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import org.gradle.api.artifacts.transform.CacheableTransform
import org.gradle.api.artifacts.transform.InputArtifact
import org.gradle.api.artifacts.transform.TransformAction
import org.gradle.api.artifacts.transform.TransformOutputs
import org.gradle.api.artifacts.transform.TransformParameters
import org.gradle.api.artifacts.type.ArtifactTypeDefinition

// Dependency exclusions cannot remove classes embedded inside these JNI JARs.
// Strip their loader copies before compilation, tests and distribution packaging;
// platform supplies the standalone hawtjni-runtime dependency for all three.
@CacheableTransform
abstract class StripBundledHawtjni implements TransformAction<TransformParameters.None> {
    @InputArtifact
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        File input = inputArtifact.get().asFile
        if (!input.name.startsWith('leveldbjni-all-')
                && !input.name.startsWith('zksnark-java-sdk-')) {
            outputs.file(input)
            return
        }
        new ZipFile(input).withCloseable { source ->
            new ZipOutputStream(new FileOutputStream(outputs.file(input.name))).withCloseable { target ->
                source.entries().each { entry ->
                    if (!entry.name.startsWith('org/fusesource/hawtjni/runtime/')
                            && !entry.name.startsWith('META-INF/maven/org.fusesource.hawtjni/hawtjni-runtime/')) {
                        ZipEntry copy = new ZipEntry(entry.name)
                        copy.time = 0
                        target.putNextEntry(copy)
                        if (!entry.directory) {
                            source.getInputStream(entry).withCloseable { target << it }
                        }
                        target.closeEntry()
                    }
                }
            }
        }
    }
}

def externalHawtjni = Attribute.of('org.tron.hawtjni.external', Boolean)
def artifactType = ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE

def runtimeClasses = { Collection<File> files ->
    def classes = [:]
    files.findAll { it.name.endsWith('.jar') }.each { file ->
        new ZipFile(file).withCloseable { jar ->
            jar.entries().each { entry ->
                if (entry.name.startsWith('org/fusesource/hawtjni/runtime/')
                        && entry.name.endsWith('.class')) {
                    if (classes.containsKey(entry.name)) {
                        throw new GradleException("Duplicate HawtJNI class ${entry.name} in ${file}")
                    }
                    jar.getInputStream(entry).withCloseable { stream ->
                        classes[entry.name] = MessageDigest.getInstance('SHA-256')
                                .digest(stream.bytes).encodeHex().toString()
                    }
                }
            }
        }
    }
    classes
}

subprojects {
    dependencies {
        attributesSchema.attribute(externalHawtjni)
        artifactTypes.getByName('jar') {
            attributes.attribute(externalHawtjni, false)
        }
        registerTransform(StripBundledHawtjni) {
            from.attribute(artifactType, 'jar').attribute(externalHawtjni, false)
            to.attribute(artifactType, 'jar').attribute(externalHawtjni, true)
        }
    }
    // Project JARs contain no bundled loader and may not exist while the task
    // graph is being resolved. Keep them out of the artifact transform.
    ['apiElements', 'runtimeElements'].each { configurationName ->
        configurations.named(configurationName) {
            attributes.attribute(externalHawtjni, true)
        }
    }
    sourceSets.configureEach { sourceSet ->
        [sourceSet.compileClasspathConfigurationName,
         sourceSet.runtimeClasspathConfigurationName].each { configurationName ->
            configurations.named(configurationName) {
                attributes.attribute(externalHawtjni, true)
            }
        }
    }

    if (name in ['framework', 'plugins']) {
        def verifyRuntime = { Collection<File> files ->
            def reference = configurations.runtimeClasspath.files.find {
                it.name == 'hawtjni-runtime-1.18.jar'
            }
            if (reference == null || runtimeClasses(files) != runtimeClasses([reference])) {
                throw new GradleException('Expected exactly one copy of the HawtJNI 1.18 runtime classes')
            }
        }
        def verifyClasspath = tasks.register('verifyHawtjniRuntime') {
            group = 'verification'
            description = 'Checks that production and test classpaths use only HawtJNI 1.18.'
            inputs.files(configurations.runtimeClasspath, configurations.testRuntimeClasspath)
            doLast {
                verifyRuntime(configurations.runtimeClasspath.files)
                verifyRuntime(configurations.testRuntimeClasspath.files)
            }
        }
        tasks.named('check') { dependsOn(verifyClasspath) }
        tasks.withType(Jar).configureEach {
            if (name in ['buildFullNodeJar', 'buildToolkitJar', 'buildArchiveManifestJar']) {
                doLast {
                    verifyRuntime([archiveFile.get().asFile])
                }
            }
        }
    }
}
