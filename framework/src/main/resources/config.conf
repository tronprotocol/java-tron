# * - transaction fees
# * - resource model updates
# * These parameters are stored in the Chain Parameters on-chain.
# * When you run a private TRON network, the Committee still exists, but since you control all SRs, 
# * it's effectively you (your SR nodes) who make up the Committee.
# * You can change parameters via proposals (API: /wallet/proposalcreate).
# ! Please note:
# ! keep this section equal for every node in the network.
# ? Ref: https://github.com/tronprotocol/java-tron/blob/develop/framework/src/main/java/org/tron/core/config/args/Args.java
committee = {
  # ! Please note:
  # ! you must enable this feature if you intend to deploy (and use) smart contracts
  allowCreationOfContracts = 1             # Whether new contract deployment is allowed (0 = disallowed; 1 = allowed)
  allowDynamicEnergy = 1                   # Enables the dynamic energy system
                                           # ! Please note: 
                                           # ! - this should be 0 on private blockchain, 
                                           # !   so the energy used when calling contracts is always the same
                                           # ! - this value must match with the SRs' ones,
                                           # !   or a different formula will be used to calculate the energy of a transaction,
                                           # !   and it will result in a BAD_BLOCK error.
  dynamicEnergyThreshold = 10000           # * Threshold value for triggering energy cost adjustments
  dynamicEnergyIncreaseFactor = 2000       # * Increase factor for energy cost when threshold is exceeded
  dynamicEnergyMaxFactor = 34000           # * Maximum allowed increase multiplier for energy cost
  allowUpdateAccountName = 1               # * Allows users to change their account name after creation
  allowSameTokenName = 1                   # * Controls whether TRC-10 tokens can share the same name
  allowDelegateResource = 1                # * Enables Resource Delegation -> the ability to delegate Bandwidth and Energy to another account
  changedDelegation = 1                    # * Enables newer version of delegation behavior introduced after certain network upgrades
  allowDelegateOptimization = 1            # * Optimizes delegation logic for performance and reduced resource cost
  allowTvmTransferTrc10 = 1                # * Allows TRC-10 token transfers from inside smart contracts executed by the TVM (Tron Virtual Machine)
  allowMultiSign = 1                       # * Enables multi-signature accounts on your chain
  allowShieldedTRC20Transaction = 1        # * Enables ZK-SNARK based shielded (private) TRC20 transactions
  allowOptimizeBlackHole = 1               # * Optimization for the "black hole" account (used when burning TRX)
  allowTvmVote = 1                         # * Enables smart contracts to participate in voting (via TVM)
  allowTvmConstantinople = 1               # * Enables opcodes and logic from the Constantinople upgrade (e.g., CREATE2, EXTCODEHASH)
  allowTvmSolidity059 = 1                  # * Ensures full compatibility with Solidity 0.5.9+ compiled contracts
  allowTvmIstanbul = 1                     # * Enables Istanbul fork features (cheaper opcodes, better gas efficiency)
  allowTvmLondon = 1                       # * Adds EIP-1559-style changes and gas-related behavior updates
  allowTvmShangHai = 1                     # * Latest fork compatibility (Shanghai), enables new EVM behavior and improved gas metering
  allowHigherLimitForMaxCpuTimeOfOneTx = 1 # * Increases CPU time limit for complex transactions (e.g., heavy smart contract execution)
  allowAssetOptimization = 1               # * Enables optimized TRC10 asset management for performance
  allowNewReward = 1                       # * Uses new reward distribution logic for SRs
