  maxEnergyLimitForConstant = 100000000    # * Energy limit for constant calls (in SUN, and since 1 TRX = 1,000,000 SUN, so 100 TRX)
                                           # ! Please note: 
                                           # ! pure/view functions are gas free,
                                           # ! but they need Energy (computation) to be executed.
                                           # ! It's a safety measure to avoid DoS (Denial of Service),
