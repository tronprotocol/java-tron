# * -------------------------------------------- BLOCK --------------------------------------------
# * Block configuration:
# * - block.needSyncCheck: controls whether the node performs synchronization checks when receiving
# *   or producing new blocks.
# *   If you disable it, the node may accept or broadcast blocks even if it's not fully synced, 
# *   which can lead to forks or inconsistencies in your private network.
# ! Please note:
# ! in a private network, set:
# ! - one SR with this parameter to false
# ! - all other SRs and Full Nodes to true
# ! This ensures that there is only one source of truth for block data.
# ! Additionally, when you create a brand new private chain, there's a moment where:
# ! - the blockchain is empty (only genesis block exists);
# ! - there are no other nodes to sync from yet;
# ! The first SR must produce the very first block(s) to bootstrap the chain.
# ! If needSyncCheck = true on that first SR, it will try to check peers' height,
# ! and since it finds no peers (everyone's empty), it assumes it's out of sync and refuses to produce blocks.
# * - block.maintenanceTimeInterval: time interval during which SRs generate blocks
# * - block.proposalExpireTime: time interval after which a proposal (to change a network parameter) expires 
block = {
  needSyncCheck = true               # * default: true
                                     # ! Please note:
                                     # ! maintenanceTimeInterval and proposalExpireTime take effect just when the node is a SR!
  maintenanceTimeInterval = 21600000 # * default: 21600000, in milliseconds (6 hours -> Epoch)
  proposalExpireTime = 259200000     # * default: 259200000, in milliseconds (3 days)
}
# * --------------------------------------------- TRX ---------------------------------------------
trx {
  # * This setting determines whether transactions must reference a specific recent block when being created.
  # * It's a security and replay protection feature.
  # * If enabled, each transaction must include:
  # * - ref_block_bytes
  # * - ref_block_hash
  # * These refer to a recent block (e.g., the latest 1–2 minutes old).
  # * This ensures that:
  # * - transactions cannot be replayed long after being broadcast
  # * - nodes know the context for validation
  # * It's similar to Ethereum's nonce + blockHash consistency mechanism.
  # * If disabled, the node might accept transactions referencing older blocks, which is not recommended.
  # * Accepted values:
  # * - solid (reccomended)
  # * - head (may cause TaPos error)
  reference.block = "solid"
  
  # * Transaction expiration time
  expiration.timeInMilliseconds = 60000 # * default: 60000, in milliseconds (1 minute)
}
