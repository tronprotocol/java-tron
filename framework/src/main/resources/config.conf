      topic = "block"       # * The name of the topic for receiving this event type in MongoDB or Kafka.
                            # ! Please note: 
                            # ! this value must be consistent with the configuration in MongoDB or Kafka.
      redundancy = false    # * If true, the event will also write to the tron.log
