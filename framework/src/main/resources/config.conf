# * ------------------------------------- NODE CONFIGURATION --------------------------------------
# * This file is used to configure a TRON network node (Full Node, Super Representative, Solidity Node, Lite Full Node).
# * This file uses a standardized commenting convention, designed to improve readability and developer experience when using
# * the Better Comments extension in Visual Studio Code.
# * The file leverages categorized comment prefixes to visually distinguish different types of information:
# ! (Important comments)
# * Used for critical notes that require developer attention.
# * These comments typically highlight constraints, warnings, or non-obvious behaviors.
# * By convention, they are always followed by a “Please note” statement.
# * (Informational comments)
# * Used to provide contextual explanations about a specific parameter or configuration section.
# * These comments are purely descriptive and do not require any action from the developer.
# ? (Reference comments)
# * Used to include external resources, documentation links, or additional references related to a parameter or section.
# * These are supplementary and do not require immediate attention.
# * This structure ensures a consistent, scannable configuration file where critical information stands out
# * while maintaining clear and accessible documentation inline.
# ? Ref (Better Comments): https://marketplace.visualstudio.com/items?itemName=aaron-bond.better-comments
# ? Ref: https://tronprotocol.github.io/documentation-en/using_javatron/private_network/
# * --------------------------------------------- SECTIONS ----------------------------------------
# * 1.  net
# * 2.  storage
# * 3.  crypto
# * 4.  node
# * 5.  rate.limiter
# * 6.  seed.node
# * 7.  genesis.block
# * 8.  localWitnessAccountAddress
# * 9.  localwitness
# * 10. localwitnesskeystore
# * 11. block
# * 12. trx
# * 13. vm
# * 14. committee
# * 15. event.subscribe
# * --------------------------------------------- NET ---------------------------------------------
# * This configuration defines the network type
# * Use:
# * - mainnet, when working with the TRON main network
# * - testnet, when working with a local testnet
# * - everything else (like "privatenet") when working on a private chain
# ! Please note:
# ! changing this value determines the genesis block and seed nodes used.
net {
  type = privatenet
}
# * ------------------------------------------- STORAGE -------------------------------------------
# * TRON uses a LevelDB database
# * LevelDB ref: https://github.com/google/leveldb
storage {
  # * Directory for storing persistent data
  db.engine = "LEVELDB"
  db.sync = false
  db.directory = "database"
  index.directory = "index"
  transHistory.switch = "on"

  # * These are the databases which will be created when starting the node for the first   time
  # * You _can_ custom these 14 databases' configurations:
  # * - account
  # * - account-index
  # * - asset-issue
  # * - block
  # * - block-index
  # * - block_KDB
  # * - peers
  # * - properties
  # * - recent-block
  # * - trans
  # * - utxo
  # * - votes
  # * - witness
  # * - witness_schedule
  # * If you don't change these configurations,
  # * default db configs will be used,
  # * and data will be stored in the path of "output-directory", 
  # * or the one set by "-d" (or "--output-directory").

  # ? If you want to improve LevelDB performances, you can use the following settings:
  # ! Please note:
  # ! if this configuration causes the node to open more file descriptors, check your system ulimit if you get a too many open files error.
  # ! See: https://github.com/tronprotocol/tips/blob/master/tip-343.md for more detail
  # * ----- Improvement settings start here -----
  # default = {
  #   maxOpenFiles = 100
  # }
  # defaultM = {
  #   maxOpenFiles = 500
  # }
  # defaultL = {
  #   maxOpenFiles = 1000
  # }
  # * ----- Improvement settings end here -----

  # * Please note:
  # * when using a different configuration for the RocksDB
  # ! Please note:
  # ! "name" is a required field that must be set!
  properties = [
    #    {
    #      name = "account",
    #      path = "storage_directory_test",
    #      createIfMissing = true,
    #      paranoidChecks = true,
    #      verifyChecksums = true,
    #      compressionType = 1,        # * compressed with snappy
    #      blockSize = 4096,           # * 4  KB =         4 * 1024 B
    #      writeBufferSize = 10485760, # * 10 MB = 10 * 1024 * 1024 B
    #      cacheSize = 10485760,       # * 10 MB = 10 * 1024 * 1024 B
    #      maxOpenFiles = 100
    #    },
    #    {
    #      name = "account-index",
    #      path = "storage_directory_test",
    #      createIfMissing = true,
    #      paranoidChecks = true,
    #      verifyChecksums = true,
    #      compressionType = 1,        # * compressed with snappy
    #      blockSize = 4096,           # * 4  KB =         4 * 1024 B
    #      writeBufferSize = 10485760, # * 10 MB = 10 * 1024 * 1024 B
    #      cacheSize = 10485760,       # * 10 MB = 10 * 1024 * 1024 B
    #      maxOpenFiles = 100
    #    },
  ]

  # * This tells the node whether it needs to update old asset formats
  # * to the new TRC10/20 format when reading older blocks.
  # * Keep it "true" for backward compatibility.
  needToUpdateAsset = true

  # * dbsettings is needed when using rocksdb as the storage implement (db.engine="ROCKSDB").
  # ! Please note: 
  # ! it is strongly recommended to not modify these parameters
  # ! unless you know what you're doing.
  dbSettings = {
    levelNumber = 7
    # compactThreads = 32
    blocksize = 64  # * n * KB
    maxBytesForLevelBase = 256  # * n * MB
    maxBytesForLevelMultiplier = 10
    level0FileNumCompactionTrigger = 4
    targetFileSizeBase = 256  # * n * MB
    targetFileSizeMultiplier = 1
  }

  # ! Please note:
  # ! the backup plugin is available only when db.engine="ROCKSDB"
  backup = {
    enable = false               # * Indicate whether enable the backup plugin
    propPath = "prop.properties" # * Record which .bak directory is valid
    bak1path = "bak1/database"   # * Two backup directories must be set to prevent application halt unexpected (e.g. kill -9).
    bak2path = "bak2/database"
    frequency = 10000            # * Indicates that the db backup should occur every 10000 blocks processed
  }

  # * If true, the node keeps a lookup index of historical balances per account for time-based queries.
  # * Default false saves disk and improves speed, but historical balance queries won't work.
  # * Only enable if you need that API.
  balance.history.lookup = false

  # * Used for resuming blockchain sync from a "checkpoint" snapshot 
  # * instead of starting from genesis (first block generated).
  # ! Please note:
  # ! usually not used in a private blockchain.
  # checkpoint.version = 2 # * version number of the snapshot
  # checkpoint.sync = true # * whether to enable checkpoint synchronization

  # * Defines transaction caching parameters (used to speed up node startup time)
  # * The estimated number of block transactions (min 100, max 10000).
  # * The total number of cached transactions is 65536 (UINT8) * txCache.estimatedTransactions
  # txCache.estimatedTransactions = 1000 # * Number of transactions expected per block (used to size cache arrays)
  # * If true, transaction cache initialization will be faster
  # txCache.initOptimization = true # * Speeds up initialization by preallocating cache memory

  # * Data root setting, for check data, currently, only reward-vi is used.
  # ! Please note:
  # ! leave untouched (even for private networks).
  # merkleRoot = {
    # reward-vi = 9debcb9924055500aaae98cdee10501c5c39d4daa75800a996f4bdda73dbccd8 # * main-net, Sha256Hash, hexString
  # }

}
# * -------------------------------------------- CRYPTO -------------------------------------------
# * Specifies the cryptographic algorithm used for signing and verifying transactions
# ! Please note: never change this value to anything else
crypto {
  engine = "eckey" # * standard ECDSA (secp256k1), used across TRON
}
# * --------------------------------------------- NODE --------------------------------------------
# * This section keeps the node configuration
node {
  # * These settings control the node visibility and discovery to/for other peers, and save discovered peers by the (current) node in the network
  # ! Depending on the type of network that you are trying to create/join,
  # ! you might want to disable the node discovery.
  # ! For example, a Solidity Node should not have this option enabled,
  # ! since its source of information (blockchain state, hence blocks)
  # ! comes from the Full Node, which is controlled by the parameter "trustNode"
  # ! in this section ("node").
  discovery {
    enable = true  # * Enable/Disable automatic peer discovery in the network
                   # * (controls whether the node searches for and announces itself to other peers)
    persist = true # * Persist the discovered peers in a local file or database
  }

  # * This section is used to export node metrics to an external tool such as "Prometheus"
  # * If enabled, your node will expose data like block sync speed, TPS, memory usage.
  metrics = {
  #   prometheus
  #   {
  #     enable = true
  #     port = "9527"
  #   }
  }

  # * This section is used to configure the node backup
  backup {
  # * Determines which node acts as leader in a backup cluster (lower value = higher priority)
  #   priority = 8

  # * UDP port used for backup communication between members
  # ! Please note:
  # ! each member should have the same configuration
  #   port = 10001

  # * How often nodes send "I'm alive" messages
  # ! Please note:
  # ! each member should have the same configuration
  # keepAliveInterval = 3000 # * milliseconds

  # * List of IPs of other nodes in the same cluster (not including yourself)
  # ! Please note:
  # ! do not include the current configuration's node IP
  #   members = [
  #     # "ip",
  #     # "ip"
  #   ]
  }

  # * This section is used to shutdown the node in specific conditions
  shutdown {
  #  BlockTime  = "54 59 08 * * ?" # * When the Block Timestamp matches the pattern (Cron format)
  #  BlockHeight = 33350800        # * When the Block Height (Block Number) matches the value
  #  BlockCount = 12               # * When the block sync count after the node has started is matched
  }

  # * trustNode is used by a Solidity Node (or light node) to designate which FullNode it "trusts"
  # * to fetch confirmed (or "solidified") blocks.
  # ! Please note:
  # ! this is used when another node (which is a Solidity Node or a Lite Full Node) connects
  # ! to a Full Node (to query data from the blockchain),
  # ! since neither the Solidity Node nor the Lite Full Node store the network history (blockchain).
  # trustNode = "ip:port"
  # trustNode = "127.0.0.1:50051"

  # * Enable extra wallet extended API interface
  walletExtensionApi = true

  # * Defines the TCP port on which your node listens for incoming peer-to-peer (P2P)
  # * connections from other nodes in the network (Full Nodes, Solidity Nodes, SRs)
  # * This value can be the same for every node in the network, since it refers to different nodes anyway.
  # ! Please note:
  # ! this is not the port where HTTP, rpc or grpc API listen on
  listen.port = 18888

  # * Max time to wait when connecting to a peer
  connection.timeout = 5 # * seconds

  # * Max time to wait for a block response from a peer
  fetchBlock.timeout = 200 # * seconds
  
  # * Number of requested blocks in a single batch during the node synchronization process
  syncFetchBatchNum = 2000 # * default: 2000 - max: 2000

  # * These define how many network IO threads are used by the Netty framework
  # * 0: auto, based on CPU cores
  # ! Please note:
  # ! only change if you're optimizing very high-performance nodes.
  tcpNettyWorkThreadNum = 0
  udpNettyWorkThreadNum = 1

  # * Maximum total peer-to-peer connections your node will maintain (both inbound and outbound),
  # * without any distinction between node type
  # * Pro tip: adjust accordingly based on the number of peers in the private network
  maxConnections = 30
  
  # * This is the lower threshold of peer connections the node tries to keep alive.
  # * If the active peers drop below minConnections, 
  # * the node will try to open new outbound connections to reachable peers (via discovery or seed)
  # * to bring itself back up.
  # ! Please note: 
  # ! it ensures the node doesn't stay isolated with too few peers.
  # * Pro tip: adjust accordingly based on the number of peers in the private network,
  # * to avoid that the node will search for nodes for an undefinitely amount of time
  minConnections = 2
  
  # * Number of peers that must be active to sync data
  # * This the minimum number of active peers required for the node to start or continue data synchronization 
  # * (block downloads, network sync).
  # * "Active" means peers that are fully connected and exchanging data, not just idle or handshake-only.
  # * If the number of active peers falls below this threshold, 
  # * the node may temporarily stall or refuse to sync until enough peers are back online.
  # * If you set minActiveConnections = 3, 
  # * then unless the node has at least 3 fully active peers, it might not perform block sync.
  # * Pro tip: adjust accordingly based on the number of peers in the private network,
  # * to avoid that the node will perform data synchronization
  minActiveConnections = 2

  # * This parameter sets the number of threads dedicated to signature validation / signing operations 
  # * (for verifying incoming transactions or blocks).
  # ! Please note:
  # ! adjust accordingly by using this formula
  # ! validateSignThreadNum = availableProcessors / 2
  # validateSignThreadNum = 16

  # * Prevents DDoS / redundant connections
  maxConnectionsWithSameIp = 2

  # * Maximum number of concurrent HTTP API connections your node will handle
  maxHttpConnectNumber = 50

  # * Minimum required block participation rate (%) to remain active.
  # ! Please note:
  # ! applies to Super Representatives only.
  # * If your SR fails to produce enough blocks, it may be penalized.
  # * This parameter defines the minimum required participation rate of Super Representatives (SRs)
  # * during block production.
  # * In other words, how many SRs must actually produce blocks during an Epoch 
  # * (6 hour by default, dictated by the value of maintenanceTimeInterval parameter in this config file).
  # * So, for example, if there are 5 SRs, and the minParticipationRate is 15 (%),
  # * then at least (0.75, rounded up to the nearest integer) 1 SR must produce blocks in a round.
  # * A "round" is a time range during which all network SRs can produce a block in their slot.
  # * In case they fail, rewards will not be shared between them.
  # * It's mainly used in Super Representative consensus logic - not configurable elsewhere.
  # * It ensures the network stays stable and avoids finalizing rounds with too few active producers.
  # ! Please note:
  # ! set this parameter to 0 to disable the check
  minParticipationRate = 15 # * percentage

  # * Controls whether the node enables API endpoints related to shielded (privacy-preserving) transactions
#   allowShieldedTransactionApi = true

  # * Controls whether the node prints internal processing logs to the console (stdout)
#   openPrintLog = true

  # * If set to true, SR packs transactions into a block in descending order of fee; 
  # * otherwise, it packs them based on their receive timestamp.
#   openTransactionSort = false # * default: false

  # * The threshold for the number of broadcast transactions received from each peer every second.
  # ! Please note:
  # ! transactions exceeding this threshold will be discarded.
#   maxTps = 1000 # * default: 1000

  # * When true, this setting might enable full TCP disconnect logic 
  # * for peers under certain conditions (e.g. poor performance).
  # * When false (default), the node retains more leniency in connection persistence.
  # * It's a kind of fail-safe/disconnect policy for TCP connections;
  # * unless you're debugging connectivity you can leave it false.
  isOpenFullTcpDisconnect = false

  # * This is a time threshold (in seconds) after which a peer is considered inactive if no communication.
  # * If a peer hasn't sent or responded in more than inactiveThreshold, the node may drop it or mark it unhealthy.
  inactiveThreshold = 600 # * seconds

  # * Defines protocol version to communicate with other peers
  # * Possible values:
  # * - 11111: mainnet
  # * - 20180622: testnet
  # * - 201910292: Nile
  # * - user defined value (integer)
  # ! Please note:
  # ! for private networks use your own, 
  # ! and keep it consistent between ALL the private network peers.
  # ! Depending on the type of network that you are trying to create/join,
  # ! you might want to comment out this parameter.
  # ! For example, a Solidity Node should not have this value filled,
  # ! since it doesn't participate to peer-to-peer communication,
  # ! but it's using the Full Node (through the "trustNode" parameter) to interact in the network.
  p2p {
    version = 11111
  }

  # * These are static peer lists:
  # * - active -> peer addresses to which the node actively attempts connection (outbound).
  # * - passive -> peer addresses from which the node accepts inbound connections (or those expected to connect to you).
  # * If left empty, node discovers peers dynamically via discovery/seeds.
  # * Use these if you want to pinpoint specific peers rather than rely entirely on discovery.
  active = [
    # * Active establish connection in any case
    # * Sample entries:
    # * "ip:port",
    # * "ip:port"
  ]

  passive = [
    # * Passive accept connection in any case
    # * Sample entries:
    # * "ip:port",
    # * "ip:port"
  ]

  # * fastForward is a list of trusted peers for fast sync (early block download).
  # * Since the block production is a "long" process (production -> propagation -> finalization),
  # * using fastForward nodes can speed up the process.
  # * If left empty, the node just uses its normal peer list/discovery - slower but works.
  # * With entries, when starting, the node prioritizes connecting to these peers to accelerate synchronization.
  fastForward = [
  ]

  # * This section includes the following configurations:
  # * - FullNode
  # * - SolidityNode
  # * - PBFT
  # * In detail:
  # * - FullNode: provides full blockchain data + APIs + can produce blocks (if SR).
  # * - SolidityNode: **historically** a separate component optimized for contract-state queries and light reads.
  # * If you want efficient contract access (especially for dApps), having a Solidity Node helps.
  # * But in modern Java-Tron, FullNode already supports solidity data queries, so you may not strictly need a separate SolidityNode. 
  # * - PBFT: stands for Practical Byzantine Fault Tolerance - the consensus mechanism layer.
  # * The HTTP / PBFT port settings allow APIs to interact with PBFT modules (e.g. proposals, votes).
  # * If you're doing smart contracts and blockchain operations, you should enable FullNode's HTTP and RPC;
  # * a separate SolidityNode is optional unless performance demands it.
  http {
    fullNodeEnable = true  # ! Please note: 
                           # ! this should be disabled on a SR
    fullNodePort = 8090
    solidityEnable = true # ! Please note:
                          # ! this should be disabled on a SR.
                          # ! Additionally, depending on the type of network you are trying to create/join,
                          # ! you might want to use a different host for the Solidity Node.
                          # ! Anyway, there are no rules that deny to use a Full Node AND a Solidity Node
                          # ! on the same host.
    solidityPort = 8091
    PBFTEnable = true     # * Practical Byzantine Fault Tolerance (consensus mechanism)
                          # ! Please note:
                          # ! this option should be disabled on every node except for SRs.
                          # ! IS IT IMPORTANT to understand that this option should be enabled
                          # ! on ALL network SRs if enable at least on one,
                          # ! or disabled on ALL network SRs if disabled at least on one.
    PBFTPort = 8092
  }

  # * Leave it false unless your host uses IPv6 only for node discovery and TCP connection
  enableIpv6 = false

  # * If enabled, node automatically checks if it's lagging behind peers, and tries to reconnect if needed
  # ! Please note: 
  # ! can help maintain sync, but may cause frequent reconnections on unstable networks
  effectiveCheckEnable = false

  # * Dynamic loading configuration function. 
  dynamicConfig = {
    # enable = false # * default: false

    # * Check interval of configuration file's change.
    # checkInterval = 600 # * seconds (default: 600)
  }

  # Whether to continue broadcast transactions after at least maxUnsolidifiedBlocks are not solidified. Default: false
  # unsolidifiedBlockCheck = false
  # maxUnsolidifiedBlocks = 54

  dns {
    # * Enable or disable DNS publish.
    # publish = false # * default: false

    # * DNS domain to publish nodes.
    # ! Please note: 
    # ! required if "publish" parameter is set to true
    # dnsDomain = "nodes1.example.org"

    # * DNS private key used to publish.
    # ! Please note: 
    # ! required if "publish" parameter is set to true
    # * Composition: hex string of length 64 characters
    # dnsPrivate = "b71c71a67e1177ad4e901695e1b4b9ee17ae16c6668d313eac2f96dbcda3f291"

    # * Known DNS URLs to publish
    # ! Please note: 
    # ! required if "publish" parameter is set to true
    # * URL format tree://{pubkey}@{domain}, default empty
    # knownUrls = [
    #     "tree://APFGGTFOBVE2ZNAB3CSMNNX6RRK3ODIRLP2AA5U4YFAA6MSYZUYTQ@nodes2.example.org",
    # ]

    # * Static nodes to published on DNS
    # staticNodes = [
    #     "ip:port",
    #     "ip:port"
    # ]

    # * Merge several nodes into a tree leaf. 
    # ! Please note: 
    # ! the value should be set between 1 and 5
    # maxMergeSize = 5

    # * Minimum threshold of node change to update data on DNS
    # changeThreshold = 0.1

    # * DNS server to publish
    # ! Please note: 
    # ! required if "publish" parameter is set to true
    # * Supported values:
    # * - aws
    # * - aliyun
    # serverType = "aws"

    # * Access key id of AWS or aliyun API
    # ! Please note: 
    # ! required if "publish" parameter is set to true
    # accessKeyId = "your-key-id"

    # Access key secret of AWS or aliyun API
    # ! Please note: 
    # ! required if "publish" parameter is set to true
    # accessKeySecret = "your-key-secret"

    # * Specifies the DNS service endpoint used for peer discovery via Alibaba Cloud (Aliyun)
    # ! Please note: 
    # ! required if "publish" parameter is set to true and "serverType" is set to "aliyun"
    # aliyunDnsEndpoint = "alidns.aliyuncs.com"

    # * Specifies the AWS Region used by the node when interacting with AWS-based infrastructure
    # ! Please note: 
    # ! required if "publish" parameter is set to true and "serverType" is set to "aws"
    # awsRegion = "us-east-1"

    # * Route 53 Hosted Zone identifier used by Amazon Web Services for DNS-based peer discovery.
    # ! Please note:
    # ! required if "publish" parameter is set to true and "serverType" is set to "aws"
    # awsHostZoneId = "your-host-zone-id"

    # * treeUrls is a list of DNS-based bootstrap peers in "tree://" format, including public domain and key info.
    # * The node will use DNS to discover peers using these URLs.
    # * If left empty, peer discovery relies solely on seed.node and active/passive lists.
    # * URL format tree://{pubkey}@{domain}, default empty
    treeUrls = [
      # "tree://AKMQMNAJJBL73LXWPXDI4I5ZWWIZ4AWO34DWQ636QOBBXNFXH3LQS@main.trondisco.net",
    ]
  }

  # * Configures gRPC APIs (used by tronWeb, TronLink)
  rpc {
    enable = true          # ! Please note: 
                           # ! this should be disabled on a SR
    port = 50051
    solidityEnable = true # ! Please note:
                          # ! this should be disabled on a SR.
                          # ! Additionally, depending on the type of network you are trying to create/join,
                          # ! you might want to use a different host for the Solidity Node.
                          # ! Anyway, there are no rules that deny to use a Full Node AND a Solidity Node
                          # ! on the same host.
    solidityPort = 50061 
    PBFTEnable = true     # * Practical Byzantine Fault Tolerance (consensus mechanism)
                          # ! Please note:
                          # ! this option should be disabled on every node except for SRs.
                          # ! IS IT IMPORTANT to understand that this option should be enabled
                          # ! on ALL network SRs if enable at least on one,
                          # ! or disabled on ALL network SRs if disabled at least on one.
    PBFTPort = 50071
    
    # * Number of gRPC thread, default availableProcessors / 2
    # thread = 16

    # * The maximum number of concurrent calls permitted for each incoming connection
    # * Helps throttle misuse.
    # maxConcurrentCallsPerConnection =

    # * The HTTP/2 flow control window
    # * If left commented, the default value is 1MB
    # * This parameter is used in the gRPC networking layer - it defines how much data (in bytes) can be "in flight" 
    # * (unacknowledged) over a gRPC connection between nodes.
    # * It prevents one node from overwhelming another with too many messages.
    # * It's essentially a backpressure mechanism, similar to TCP's sliding window.
    # flowControlWindow = 

    # * Closes idle gRPC connections after n milliseconds
    # * Connection being idle for longer than which will be gracefully terminated
    maxConnectionIdleInMillis = 60000 # * milliseconds

    # * Connection lasting longer than which will be gracefully terminated
    # maxConnectionAgeInMillis =

    # * The maximum message size allowed to be received on the server
    # * If left commented, the default value is 4MB
    # maxMessageSize =

    # * The maximum size of header list allowed to be received
    # * If left commented, the default value is 8192
    # maxHeaderListSize =

    # * Number of RST_STREAM frames allowed to be sent per connection per period for grpc, by default there is no limit.
    # maxRstStream =

    # * Number of seconds per period for grpc
    # secondsPerWindow = # * seconds

    # * How many peer connections are needed before allowing broadcast.
    # * Please note: transactions can only be broadcasted if the number of effective connections is reached.
    minEffectiveConnection = 1

    # * The switch of the reflection service, effective for all gRPC services
    # * toggles gRPC reflection (metadata introspection), 
    # * useful for clients/tools to inspect services dynamically.
    # reflectionService = true
  }

  # * Number of worker threads handling Solidity (read-only) queries like contract state lookups.
  # * If you see timeouts, increase it to match your CPU cores.
  # * Even on an SR or block-producing FullNode,  
  # * if the node also handles contract queries (i.e. acts as Solidity provider), this setting is relevant.
  # * If your node doesn't run a separate Solidity module, 
  # * this may still be used internally by the FullNode's contract query layer.
  # solidity.threads = 8

  # * Maximum allowed percentage of block time used to produce a block.
  # * Default 75% → ensures block is produced and broadcast before the next SR's turn.
  # * It means that the timeout is fired after the threshold of 0,25 seconds (for this case) is overtook
  # * to produce a block
  # * 75% of a block time (or a slot), which is 3 seconds, so (75 * 3) / 100 = 0,25 seconds
  # blockProducedTimeOut = 75

  # * Rate limit for incoming transactions per second from network peers
  # netMaxTrxPerSecond = 700

  # * Whether to enable the node detection function.
  # nodeDetectEnable = false # * default: false

  # * Enables read APIs for block/transaction history when running a Lite Full Node (one that doesn't store full blockchain).
  # * Leave false unless you explicitly run a lite node.
  # openHistoryQueryWhenLiteFN = false

  # * This exposes Ethereum-compatible JSON-RPC APIs (like eth_getLogs).
  # * If you want compatibility with tools like Web3.js, you can enable this.
  jsonrpc {
    # * Note: If you turn on jsonrpc and run it for a while and then turn it off, you will not
    # * be able to get the data from eth_getLogs for that period of time.

    # httpFullNodeEnable = true
    # httpFullNodePort = 8545
    # httpSolidityEnable = true
    # httpSolidityPort = 8555
