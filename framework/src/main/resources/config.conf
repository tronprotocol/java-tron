  minTimeRatio = 0.0                       # * Relative bounds on execution time scaling
  maxTimeRatio = 5.0   
  saveInternalTx = false                   # * Whether to persist internal transactions (calls within contracts),
                                           # * when a contract calls another contract's method and emit a transaction.
  # saveFeaturedInternalTx = false         # * Indicates whether the node stores featured internal transactions, 
                                           # * such as freeze, vote and so on
  # saveCancelAllUnfreezeV2Details = false # * Indicates whether the node stores the details of the internal 
                                           # * transactions generated by the CANCELALLUNFREEZEV2 opcode, 
