net {
  # type = mainnet
}

storage {
  db.engine = "LEVELDB",
  db.sync = false,
  db.directory = "database",

  transHistory.switch = "on",

  properties = [
  #   {
  #     name = "account",
  #     path = "storage_directory_test",
  #     maxOpenFiles = 100
  #   },
  ]

  needToUpdateAsset = true

  dbSettings = {
    levelNumber = 7
    # compactThreads = 32
    blocksize = 64  // n * KB
    maxBytesForLevelBase = 256  // n * MB
    maxBytesForLevelMultiplier = 10
    level0FileNumCompactionTrigger = 4
    targetFileSizeBase = 256  // n * MB
    targetFileSizeMultiplier = 1
    maxOpenFiles = 5000
  }

  balance.history.lookup = false

  txCache.initOptimization = true
}

node.discovery = {
  enable = true
  persist = true
}

# node.shutdown = {
#   BlockTime  = "54 59 08 * * ?"
#   BlockHeight = 33350800
#   BlockCount = 12
# }

node.backup {
  port = 10001
  priority = 8
  keepAliveInterval = 3000
  members = [
    # "ip",
    # "ip"
  ]
}

node.metrics = {
  prometheus {
    enable = false
    port = 9527
  }
}

node {
  trustNode = "127.0.0.1:50051"

  listen.port = 18888

  fetchBlock.timeout = 200

  maxConnections = 30
  minConnections = 8
  minActiveConnections = 3
  maxConnectionsWithSameIp = 2
  maxHttpConnectNumber = 50
  minParticipationRate = 15

  isOpenFullTcpDisconnect = false
  inactiveThreshold = 600 // seconds

  p2p {
    version = 11111
  }

  active = [
    # "ip:port",
    # "ip:port"
  ]

  passive = [
    # "ip:port",
    # "ip:port"
  ]

  fastForward = [
    "100.27.171.62:18888",
    "15.188.6.125:18888"
  ]

  http {
    fullNodeEnable = true
    fullNodePort = 8090
    solidityEnable = true
    solidityPort = 8091
    PBFTEnable = true
    PBFTPort = 8092
  }

  rpc {
    enable = true
    port = 50051
    solidityEnable = true
    solidityPort = 50061
    PBFTEnable = true
    PBFTPort = 50071

    maxConnectionIdleInMillis = 60000
    minEffectiveConnection = 1

    reflectionService = false
  }

  dynamicConfig = {
    # enable = false
    # checkInterval = 600
  }

  dns {
    treeUrls = [
      #"tree://AKMQMNAJJBL73LXWPXDI4I5ZWWIZ4AWO34DWQ636QOBBXNFXH3LQS@main.trondisco.net",
    ]
  }

  openHistoryQueryWhenLiteFN = false

  jsonrpc {
    httpFullNodeEnable = false
    httpFullNodePort = 8545

    maxBlockRange = 5000
    maxAddressSize = 1000
    maxSubTopics = 1000
    maxBlockFilterNum = 50000
    maxBatchSize = 100
    maxResponseSize = 26214400
    maxLogFilterNum = 20000
    maxMessageSize = 4194304
  }

  admin {
    ipc {
      enable = false
      socketDirectory = ""
    }
  }

  disabledApi = [
    #  "getaccount",
    #  "getnowblock2"
  ]
}

