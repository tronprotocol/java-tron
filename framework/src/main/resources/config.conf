  # *   will begin from the specified block height. Note: We recommend using the latest version
  # *   of the event plugin when enabling this feature.
  startSyncBlockNum = 0

  # * Settings to use (or not) the native event subscripiton plugin
  native = {
    useNativeQueue = false   # * true = use ZeroMQ queue; false = use Kafka or MongoDB
    bindport = 5555          # * Port used by the ZeroMQ (native) queue
    sendqueuelength = 1000   # * Max length of the send ZeroMQ queue
  }

